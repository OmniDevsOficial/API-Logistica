server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: operacional-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}?currentSchema=operacional}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: operacional
  flyway:
    schemas: operacional
    create-schemas: true
  # Correção: usar spring.servlet.multipart (sem "service") para aplicar
  # o limite de 10 MB por arquivo, em vez do padrão de 1 MB do Spring.
  servlet:
    multipart:
      max-file-size: 10MB
      # Margem para os campos e delimitadores do formulário multipart.
      # O arquivo individual continua limitado a 10 MB.
      max-request-size: 15MB

relatorio:
  service:
    url: ${RELATORIO_SERVICE_URL:http://localhost:8082}
